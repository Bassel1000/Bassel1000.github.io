<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="phoenixGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="45%" stop-color="#f97316" />
      <stop offset="80%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="bgGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="borderGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="borderGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.5" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .bg-rect {
        fill: url(#bgGradDark);
        stroke: url(#borderGradDark);
        stroke-width: 3.5;
      }
      @media (prefers-color-scheme: light) {
        .bg-rect {
          fill: url(#bgGradLight);
          stroke: url(#borderGradLight);
          stroke-width: 3.5;
        }
      }
    </style>
  </defs>

  <!-- Base Squircle -->
  <rect class="bg-rect" x="5" y="5" width="118" height="118" rx="28" />

  <!-- Ambient Glow Behind Flame -->
  <circle cx="64" cy="64" r="36" fill="#f97316" opacity="0.25" filter="url(#glow)" />

  <!-- Phoenix Wings & Flame Mark -->
  <g filter="url(#glow)" transform="translate(14, 13) scale(0.78)">
    <!-- Central flame body & rising crest -->
    <path d="M64 6 C58 26, 46 38, 46 54 C46 72, 56 82, 64 98 C72 82, 82 72, 82 54 C82 38, 70 26, 64 6 Z" fill="url(#phoenixGrad)" />
    <!-- Left wing flame sweep -->
    <path d="M64 46 C42 36, 18 42, 12 62 C20 68, 34 64, 44 68 C32 76, 24 88, 26 98 C36 96, 46 88, 52 80 C48 88, 50 96, 54 102 C58 92, 58 76, 64 64 Z" fill="url(#phoenixGrad)" opacity="0.95" />
    <!-- Right wing flame sweep -->
    <path d="M64 46 C86 36, 110 42, 116 62 C108 68, 94 64, 84 68 C96 76, 104 88, 102 98 C92 96, 82 88, 76 80 C80 88, 78 96, 74 102 C70 92, 70 76, 64 64 Z" fill="url(#phoenixGrad)" opacity="0.95" />
    <!-- Hot white ignition core -->
    <ellipse cx="64" cy="62" rx="5" ry="11" fill="#ffffff" opacity="0.95" />
  </g>
</svg>
