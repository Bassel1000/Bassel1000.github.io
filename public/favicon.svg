<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="goldGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="borderDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="borderLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .bg-rect { fill: url(#bgDark); stroke: url(#borderDark); stroke-width: 3.5; }
      .mono-text { fill: url(#goldGrad); }
      @media (prefers-color-scheme: light) {
        .bg-rect { fill: url(#bgLight); stroke: url(#borderLight); stroke-width: 3.5; }
        .mono-text { fill: url(#goldGradLight); }
      }
    </style>
  </defs>

  <!-- Squircle Base -->
  <rect class="bg-rect" x="5" y="5" width="118" height="118" rx="28" />

  <!-- Ambient Glow Behind Monogram -->
  <circle cx="64" cy="64" r="32" fill="#fbbf24" opacity="0.18" filter="url(#glow)" />

  <!-- Stylized Geometric "BE" Monogram -->
  <g transform="translate(18, 20)">
    <!-- B Glyph -->
    <path class="mono-text" d="M12 12 L44 12 C56 12 64 19 64 29 C64 36 59 41 52 44 C61 47 67 54 67 65 C67 77 57 84 44 84 L12 84 Z M26 25 L26 41 L41 41 C46 41 50 38 50 33 C50 28 46 25 41 25 Z M26 53 L26 71 L43 71 C48 71 53 67 53 62 C53 57 48 53 43 53 Z" />
    <!-- E Accent Bar Interlock -->
    <path class="mono-text" d="M56 12 L84 12 L84 24 L66 24 L66 41 L80 41 L80 53 L66 53 L66 72 L84 72 L84 84 L56 84 Z" opacity="0.95" />
    <!-- Micro Angular Cut Accents -->
    <polygon points="76,8 84,0 88,4 80,12" fill="#fef08a" opacity="0.8" />
  </g>
</svg>
